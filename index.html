<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ============================================================
       This portfolio has MOVED to https://junaidai.com/
       This page exists only to redirect visitors and to consolidate
       search authority onto junaidai.com.

       Do NOT restore the old portfolio markup here. Two indexable copies
       of the same portfolio split the "Muhammad Junaid" entity across two
       domains — the previous version also declared its own Person JSON-LD
       (different email, phone, Medium handle and a stale employer), which
       is exactly what kept junaidai.com from ranking for his own name.
       The old page is preserved in git history (commit 4193b4f and its
       parents) if it is ever needed again.
       ============================================================ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Redirect. A meta refresh with a 0 delay is treated by Google as a
       permanent redirect; the script fires first for real browsers. -->
  <meta http-equiv="refresh" content="0; url=https://junaidai.com/" />
  <script>location.replace("https://junaidai.com/");</script>

  <!-- noindex, follow — drop this page from the index but still pass
       authority through the link. Deliberately NO canonical tag: noindex
       and canonical are contradictory signals and Google ignores the
       pair. The redirect above is the consolidation signal. -->
  <meta name="robots" content="noindex, follow" />

  <title>Muhammad Junaid — now at junaidai.com</title>
  <meta name="description" content="Muhammad Junaid's portfolio has moved to junaidai.com — AI Engineer &amp; Full-Stack AI Developer building RAG systems, AI agents and GenAI products." />
  <meta name="author" content="Muhammad Junaid" />

  <!-- Social tags point at the NEW domain so shares resolve there. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://junaidai.com/" />
  <meta property="og:title" content="Muhammad Junaid — AI Engineer" />
  <meta property="og:description" content="Portfolio moved to junaidai.com" />

  <!-- No Person/WebSite JSON-LD here on purpose. junaidai.com is the single
       source of truth for that entity. -->

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center; padding: 1.5rem;
      background: #07090f; color: #e8ecf8; text-align: center;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      max-width: 34rem; padding: 2.5rem 2rem;
      border: 1px solid rgba(255,255,255,.09); border-radius: 18px;
      background: rgba(255,255,255,.03);
    }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; letter-spacing: -.02em; }
    p  { margin: 0 0 1.5rem; color: #a9b2c9; }
    a.btn {
      display: inline-block; padding: .8rem 1.5rem; border-radius: 999px;
      text-decoration: none; font-weight: 600; color: #07090f;
      background: linear-gradient(100deg, #9b7bff, #22d3ee);
    }
    a.btn:focus-visible { outline: 2px solid #22d3ee; outline-offset: 3px; }
    .small { margin: 1.5rem 0 0; font-size: .85rem; color: #6b7488; }
    .small a { color: #a9b2c9; }
  </style>
</head>

<body>
  <div class="card">
    <h1>This portfolio has moved</h1>
    <p>Muhammad Junaid — AI Engineer &amp; Full-Stack AI Developer.<br />
       Everything now lives at <strong>junaidai.com</strong>.</p>
    <p><a class="btn" href="https://junaidai.com/">Go to junaidai.com &rarr;</a></p>
    <p class="small">
      Not redirected automatically? <a href="https://junaidai.com/">Follow this link</a>.
      &middot; <a href="https://junaidai.com/projects/">Projects</a>
      &middot; <a href="https://junaidai.com/contact/">Contact</a>
    </p>
  </div>
</body>
</html>
